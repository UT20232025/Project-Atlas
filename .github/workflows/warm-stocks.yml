name: Warm stock cards

# Refreshes the curated /stocks cards into the DB (StockSnapshot), one ticker at
# a time with a pause between, so we stay inside Twelve Data's free tier
# (~8 credits/min · 800/day; each stock costs 4). The /stocks page reads only the
# DB, so this is what keeps it populated. Requires repo secret CRON_SECRET.

on:
  schedule:
    # Every 3 hours — daily-frame stock signals barely move intraday.
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

jobs:
  warm-stocks:
    runs-on: ubuntu-latest
    steps:
      - name: Warm each stock card
        run: |
          # Warm every ticker explicitly via ?ticker=, which calls the write path
          # directly and always refreshes the row — no dependence on the
          # stalest/freshness heuristic. 30s between calls keeps us inside Twelve
          # Data's free tier (~2 stocks/min · 4 credits each = 8/min). Keep this
          # list in sync with STOCK_SCANNER_SYMBOLS in lib/stocks/stockScanner.ts.
          TICKERS="AAPL MSFT NVDA TSLA AMZN GOOGL META AMD NFLX AVGO COIN PLTR JPM V WMT"
          for t in $TICKERS; do
            # No -f: print the body even on 4xx/5xx so a failing warm is visible.
            body=$(curl -sS -w "|HTTP:%{http_code}" --max-time 90 \
              --retry 3 --retry-delay 20 --retry-all-errors --retry-connrefused \
              "https://www.genwelth.com/api/cron/warm-stocks?key=${CRON_SECRET}&ticker=${t}") || true
            echo "warm-stocks[$t]: $body"
            sleep 30
          done
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
